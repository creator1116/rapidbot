name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Check formatting
      run: cargo fmt --all -- --check
    # `--all-features` so the opt-in `test-support` harness is linted and
    # tested too: it is behind a feature, so a default build never sees it.
    - name: Clippy
      run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
    - name: Build
      run: cargo build --workspace --all-targets --all-features --locked --verbose
    - name: Run tests
      run: cargo test --workspace --all-features --locked --verbose

  windows:
    name: Windows recorder

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
    - name: Clippy
      run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
    - name: Build
      run: cargo build --workspace --all-targets --all-features --locked --verbose
    - name: Run tests
      run: cargo test --workspace --all-features --locked --verbose
