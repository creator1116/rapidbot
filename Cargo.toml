[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/creator1116/rapidbot"

# Every internal dependency carries a version beside its path: crates.io
# refuses a publish whose dependencies have no version, and the version is
# what turns these entries into a publish order (see docs/publishing.md).
[workspace.dependencies]
rapidbot-auth = { path = "crates/auth", version = "0.1.0" }
rapidbot-buf = { path = "crates/buf", version = "0.1.0" }
rapidbot-client = { path = "crates/client", version = "0.1.0" }
rapidbot-human = { path = "crates/human", version = "0.1.0" }
rapidbot-buf-derive = { path = "crates/buf-derive", version = "0.1.0" }
rapidbot-nbt = { path = "crates/nbt", version = "0.1.0" }
rapidbot-physics = { path = "crates/physics", version = "0.1.0" }
rapidbot-protocol = { path = "crates/protocol", version = "0.1.0" }
rapidbot-world = { path = "crates/world", version = "0.1.0" }

aes = "0.8"
aes-gcm = "0.10"
base64 = "0.22"
cfb8 = "0.8"
# Stock zlib rather than miniz_oxide: vanilla compresses with java.util.zip
# (zlib, default level), and the compressed bytes are visible to the server.
flate2 = { version = "1", default-features = false, features = ["zlib"] }
hickory-resolver = "0.25"
md-5 = "0.10"
percent-encoding = "2"
proc-macro2 = "1"
quote = "1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rsa = { version = "0.9", features = ["sha2"] }
sentry = "0.49.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
syn = { version = "2", features = ["full"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
url = "2"
webpki-roots = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib"] }
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "time", "sync"] }
uuid = { version = "1", features = ["serde", "v4"] }

# Dependencies (zlib especially) are too slow unoptimised: a debug build
# stalls the main thread while chunks stream in, which skews tick timing.
[profile.dev.package."*"]
opt-level = 3
