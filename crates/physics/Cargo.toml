[package]
name = "rapidbot-physics"
description = "Vanilla player movement: input, travel, collision, step-up, ground state"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Needs the game-derived data (docs/data.md) to build, which cannot
# ship on crates.io; consumers use the git dependency instead.
publish = false

# Generated from your own copy of the game, never published: docs/data.md.
exclude = ["src/mth_tables.rs"]

[dependencies]
rapidbot-world.workspace = true
