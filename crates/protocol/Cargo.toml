[package]
name = "rapidbot-protocol"
description = "Minecraft protocol: framing, compression, encryption and packets"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Needs the game-derived data (docs/data.md) to build, which cannot
# ship on crates.io; consumers use the git dependency instead.
publish = false

# Generated from your own copy of the game, never published: docs/data.md.
exclude = ["src/ids.rs"]

[dependencies]
rapidbot-buf.workspace = true
aes.workspace = true
cfb8.workspace = true
flate2.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
rapidbot-nbt.workspace = true
