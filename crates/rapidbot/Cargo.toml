[package]
name = "rapidbot"
version = "0.0.1-alpha"
description = "Headless Minecraft bots that behave like the vanilla client and the person using it"
license = "MIT"
repository = "https://github.com/creator1116/rapidbot"
readme = "README.md"
# crates.io allows at most five keywords.
keywords = ["minecraft", "bot", "headless", "client", "automation"]
categories = ["network-programming", "game-development"]

# Inherit edition and other workspace fields.
edition.workspace = true

[features]
# The controller test harness in `rapidbot-client` (`test_support`).
test-support = ["rapidbot-client/test-support"]

[dependencies]
rapidbot-auth.workspace = true
rapidbot-client.workspace = true
rapidbot-human.workspace = true
rapidbot-physics.workspace = true
rapidbot-protocol.workspace = true
rapidbot-world.workspace = true

[dev-dependencies]
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
