[package]
name = "rapidbot-recorder"
description = "Records your own mouse and movement-key input while playing Minecraft, to fit the human models"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rapidbot-human.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input",
    "Win32_UI_WindowsAndMessaging",
] }
